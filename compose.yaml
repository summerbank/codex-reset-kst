services:
  monitor:
    build: .
    container_name: codex-reset-monitor
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    environment:
      DATA_DIR: /app/data
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
